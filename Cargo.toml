[workspace]
resolver = "2"
members = [
    "crates/flint-kernels",
    "crates/flint-kv",
    "crates/flint-core",
    "crates/flint-schedule",
    "crates/flint-server",
    "crates/flint-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/Tafadzwa-Chiwozva/flint"

[workspace.dependencies]
flint-kernels = { path = "crates/flint-kernels" }
flint-kv = { path = "crates/flint-kv" }
flint-core = { path = "crates/flint-core" }
flint-schedule = { path = "crates/flint-schedule" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
rayon = "1"
half = "2"
safetensors = "0.4"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
hf-hub = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
axum = "0.7"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
async-stream = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
