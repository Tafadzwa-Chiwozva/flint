[package]
name = "flint-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CPU math kernels and the CUDA forward path for Flint"
readme = "../../README.md"

[features]
default = []
# Compiles kernels/ops.cu to PTX and enables the driver/cuBLAS runtime.
# The CPU forward pass does not call these kernels unless the server is
# started with `--device cuda`.
cuda = ["dep:cudarc"]

[dependencies]
cudarc = { version = "0.19.10", optional = true, default-features = false, features = [
    "std",
    "driver",
    "cublas",
    "nvrtc",
    "fallback-dynamic-loading",
    "cuda-12080",
] }

[dev-dependencies]
rand = { workspace = true }
