name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets

  # Compiles the CUDA feature and runs every test that does not need a GPU.
  # Ignored GPU-vs-CPU tests stay skipped. nvcc produces PTX; nothing is launched.
  cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CUDA toolkit and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev nvidia-cuda-toolkit
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test CUDA feature without a GPU
        run: |
          cargo test -p flint-kernels --features cuda
          cargo test -p flint-core --features cuda
          cargo test -p flint-server --features cuda
          cargo clippy -p flint-kernels -p flint-core -p flint-server --features cuda --all-targets -- -D warnings
